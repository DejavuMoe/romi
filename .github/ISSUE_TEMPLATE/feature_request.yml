name: 功能建议
description: 提出新能力或改进现有能力
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        romi 刻意保持范围小。远程终端、任意命令执行、文件管理、自动更新、多租户、分布式存储和 Hub Docker
        不在计划内，见[产品需求](https://github.com/DejavuMoe/romi/blob/master/docs/requirements.md)。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 在什么运维场景下遇到了什么困难；尽量描述问题而不是方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的做法
      description: 希望 romi 怎样帮你解决，涉及界面时说明在哪个页面
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 现在的替代办法
      description: 目前怎样绕过，或考虑过哪些其他做法
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索过已有 Issue，没有重复
          required: true
        - label: 这项建议不属于上面列出的非目标
          required: true
