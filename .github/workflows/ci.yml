name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and verify package
    runs-on: ubuntu-24.04
    # The Hub links DuckDB, which the official crate compiles from source: this
    # is a C++ build, in debug and again in release. Measured locally at roughly
    # two minutes per profile on twelve cores; the limit leaves room for four.
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up development tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.7
          install_args: node pnpm python rust

      - name: Ensure a C/C++ toolchain for DuckDB
        # The image ships one; this states the requirement rather than assuming
        # it, so a runner without it fails here instead of inside the crate build.
        run: |
          cc --version
          c++ --version

      - name: Install locked dependencies
        run: make setup

      - name: Build frontends, lint and test
        run: make check

      - name: Build and verify release package
        run: |
          make package
          (cd dist && sha256sum --check ./*.sha256)
          romi_unpack=$(mktemp -d)
          trap 'rm -rf "$romi_unpack"' EXIT
          tar -xzf dist/romi-*.tar.gz -C "$romi_unpack"
          python3 scripts/smoke.py --bin-dir "$romi_unpack/bin"
          # The offline SQLite -> DuckDB migration, against the packaged binary.
          python3 scripts/test-legacy-migration.py --bin-dir "$romi_unpack/bin"
